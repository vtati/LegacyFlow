[project]
name = "legacyflow-api"
version = "0.1.0"
description = "LegacyFlow modular-monolith API (FastAPI, Python 3.12)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "reportlab>=4.0",
    # Phase 2 document extraction: pypdf is the primary PDF text extractor
    # (runtime import in app/domains/interview/text_extract.py).
    "pypdf>=6.0",
    # Phase 2 document extraction: OCR fallback for scanned/image-only PDFs.
    # pymupdf renders pages; pytesseract drives the tesseract binary (installed
    # via apt on Railway — see nixpacks.toml). Both are optional at runtime:
    # extraction degrades to "no readable text" when they are missing.
    "pymupdf>=1.24",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    # PRD §4.2: error monitoring/observability. Optional at runtime —
    # app.main only initializes Sentry when SENTRY_DSN is set and the
    # import succeeds.
    "sentry-sdk>=2.0",
    # Worker client for the admin reminder-dispatch trigger
    # (POST /v1/admin/reminders/dispatch enqueues the worker's
    # send_due_reminders actor on the shared REDIS_URL broker).
    # Documented reason: the dispatch endpoint must address the worker's
    # Dramatiq actors without importing worker code; imports stay lazy in
    # app/domains/privacy/dispatch.py so the API also runs without them.
    "dramatiq>=1.18",
    "redis>=5.0",
    # ADR-002: Fernet encryption for AI interviewer turn bodies. The data key
    # comes from INTERVIEW_TURN_ENCRYPTION_KEY; reads/writes fail closed when
    # unset. Documented reason: interview pause/resume + proposal provenance +
    # attorney audit require raw conversation content, stored encrypted.
    "cryptography>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.7",
    "mypy>=1.11",
    "httpx>=0.27",
    # E6.6 performance harness: throwaway Postgres for load tests
    # (pgserver bundles the binaries; skips gracefully when unavailable).
    "pgserver>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "N", "RUF100"]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
