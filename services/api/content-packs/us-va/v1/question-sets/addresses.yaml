# Address details question set (v1).
# Collects the addresses the will template needs for identification.
question_set:
  id: addresses
  version: 1.0.0
  title: 'Addresses'
sections:
  - id: testator
    title: 'Your address'
    questions:
      - key: testator_street_address
        type: text
        label: 'What is your street address?'
        help: 'Why we ask: the will identifies you by your residence.'
        required: false
        maps_to: facts.testator_street_address
      - key: testator_city
        type: text
        label: 'What city do you live in?'
        help: 'Why we ask: the will states your city alongside your state.'
        required: false
        maps_to: facts.testator_city
  - id: guardian
    title: 'Guardian address'
    questions:
      - key: primary_guardian_address
        type: text
        label: 'What city and state does your nominated guardian live in?'
        help: 'Why we ask: the will identifies the guardian by residence.'
        required: false
        maps_to: facts.guardian_address
