[project]
name = "legacyflow-worker"
version = "0.1.0"
description = "LegacyFlow background worker (Dramatiq + Redis). Slice 1: scaffold only."
requires-python = ">=3.12"
dependencies = [
    "dramatiq>=1.18",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "N", "RUF100"]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
