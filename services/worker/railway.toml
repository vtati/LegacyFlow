# Railway service config for the LegacyFlow Dramatiq worker.
# Service root directory in Railway: services/worker
# Requires REDIS_URL (reference the project's Redis service) and
# DATABASE_URL (same Postgres as the API).

[build]
builder = "RAILPACK"

[deploy]
# Two memory/cost controls live in this command (Railway audit, 2026-10-17):
# 1. PATH hardening, same as the API: Railway migrated the builder from
#    Nixpacks to Railpack, whose builds install dependencies into a venv
#    that custom start commands must put on PATH themselves (and which
#    only exists at all because requirements.txt is present — see the API
#    railway.toml note; without it the image has no deps installed).
# 2. --processes 2 --threads 4: Dramatiq otherwise defaults to one process
#    per host CPU (dozens on Railway) at ~50 MB RSS each, which held the
#    worker baseline at ~1-1.5 GB for a workload peaking at 0.055 vCPU.
#    Two processes keep a consumer alive while one restarts.
# Keep this string in sync with the Railway service config — the platform
# value wins at deploy time.
startCommand = "export PATH=\"$PWD/.venv/bin:$PATH\" && exec dramatiq worker.actors --processes 2 --threads 4"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
